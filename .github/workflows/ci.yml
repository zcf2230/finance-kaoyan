name: CI

on:
  push:
    branches: [master, main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 安装依赖
        run: npm ci

      - name: 数据能解析（坏 JSON 会让整个应用启动失败）
        run: node tools/report-gaps.js --no-write > /dev/null

      - name: 渲染 / 迁移 / 网页版 / 鉴权测试
        run: npm test

      - name: 网页版能构建
        run: npm run build:web
