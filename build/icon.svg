<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <!-- 应用图标源文件。改完用 Edge 无头模式重新栅格化：
       msedge --headless=new --disable-gpu --window-size=512,512 \
              --default-background-color=00000000 --screenshot=build/icon.png <本文件的 HTML 包装页>
       electron-builder 会把 build/icon.png 自动转成 .ico 并嵌入 exe。 -->
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f525a"/>
      <stop offset="55%" stop-color="#176b75"/>
      <stop offset="100%" stop-color="#2fa0ac"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#g)"/>
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#sheen)"/>
  <text x="256" y="262" text-anchor="middle" dominant-baseline="central"
        font-family="Microsoft YaHei, PingFang SC, sans-serif" font-weight="bold"
        font-size="300" fill="#ffffff">研</text>
</svg>
