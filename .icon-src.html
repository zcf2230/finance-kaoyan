<!DOCTYPE html>
<html><head><meta charset="UTF-8"><style>
  html,body{margin:0;padding:0;width:512px;height:512px;overflow:hidden;background:transparent}
</style></head>
<body>
<svg width="512" height="512" viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#1a5fb4"/>
      <stop offset="100%" stop-color="#4a90d9"/>
    </linearGradient>
    <linearGradient id="sheen" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.22"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <!-- 圆角底板 -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#g)"/>
  <!-- 顶部高光 -->
  <rect x="0" y="0" width="512" height="512" rx="112" ry="112" fill="url(#sheen)"/>
  <!-- 金 -->
  <text x="256" y="256" text-anchor="middle" dominant-baseline="central"
        font-family="Microsoft YaHei, PingFang SC, sans-serif" font-weight="bold"
        font-size="300" fill="#ffffff">金</text>
</svg>
</body></html>
